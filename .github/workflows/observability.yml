name: Observability configuration

on:
  push:
    branches: [main, codex/langfuse-observability]
    paths: [ops/langfuse/**, backend/**, scripts/release.ps1, .github/workflows/observability.yml]
  pull_request:
    branches: [main]
    paths: [ops/langfuse/**, backend/**, scripts/release.ps1, .github/workflows/observability.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ""
      INETCLOUD_BASE_URL: ""
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --locked
      - run: uv run ruff check app tests/test_observability.py
      - name: Targeted tracing, provider and fail-open regression
        run: uv run pytest -m "not integration and not live" tests/test_observability.py tests/test_diagnostics.py tests/test_gemini.py tests/test_providers.py tests/test_hybrid_sequence.py tests/test_routing_and_hybrid.py -q
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate offline configuration and isolation
        run: python ops/langfuse/test_compose.py -v
