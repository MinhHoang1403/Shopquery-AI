name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run (reliability avoids unrelated golden/model suites)
        type: choice
        options: [all, reliability]
        default: reliability

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --locked
      - name: Run Ruff
        run: uv run ruff check app scripts tests
      - name: Run backend unit tests
        shell: bash
        env:
          CHECK_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$CHECK_SCOPE" = reliability ]; then
            uv run pytest -m "not integration and not live" tests/test_error_contract.py tests/test_explicit_routing.py tests/test_sql_answer.py tests/test_gemini.py tests/test_providers.py tests/test_plan_providers.py tests/test_dataset_routing.py tests/test_conversation_context.py tests/test_diagnostics.py tests/test_api.py tests/test_plan_security.py tests/test_plan_binding.py tests/test_query_compiler.py tests/test_hybrid_sequence.py tests/test_hybrid_answer_consistency.py tests/test_count_conformance.py tests/test_join_policy.py tests/test_three_table_join.py tests/test_sql_reliability.py -q
          else
            uv run pytest -m "not integration and not live"
          fi

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      RUN_DATABASE_TESTS: "1"
      SHOPQUERY_TEST_DATABASE_URL: postgresql+psycopg://shopquery_setup:ci_setup_password@127.0.0.1:5432/shopquery_ci
      DATABASE_SETUP_URL: postgresql+psycopg://shopquery_setup:ci_setup_password@127.0.0.1:5432/shopquery_ci
      DATABASE_READONLY_URL: postgresql+psycopg://shopquery_reader:ci_readonly_password@127.0.0.1:5432/shopquery_ci
      GEMINI_API_KEY: ""
      INETCLOUD_BASE_URL: ""
      AI_GEMINI_FALLBACK_ENABLED: "false"
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie
        env:
          POSTGRES_DB: shopquery_ci
          POSTGRES_USER: shopquery_setup
          # Disposable credentials for this job's isolated service only.
          POSTGRES_PASSWORD: ci_setup_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopquery_setup -d shopquery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --locked
      - name: Prepare isolated database role
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text

          from app.core.config import Settings

          settings = Settings(_env_file=None)
          engine = create_engine(settings.database_setup_url)
          assert engine.url.database == "shopquery_ci"
          assert not settings.gemini_api_key
          assert not settings.inetcloud_base_url
          with engine.begin() as connection:
              connection.execute(text(
                  "CREATE ROLE shopquery_reader LOGIN PASSWORD 'ci_readonly_password'"
              ))
              connection.execute(text(
                  "ALTER ROLE shopquery_reader SET default_transaction_read_only = on"
              ))
              connection.execute(text(
                  "GRANT CONNECT ON DATABASE shopquery_ci TO shopquery_reader"
              ))
          engine.dispose()
          PY
      - name: Run PostgreSQL integration tests without live AI calls
        shell: bash
        env:
          CHECK_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$CHECK_SCOPE" = reliability ]; then
            uv run pytest -m "integration and not live" tests/test_plan_factory_integration.py tests/test_plan_expressions_integration.py tests/test_hybrid_evidence_integration.py tests/test_hybrid_policy_domains_integration.py tests/test_context_permutations_integration.py -q
          else
            uv run pytest -m "integration and not live" -v
          fi

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for offline browser tests
        run: npx playwright install --with-deps chromium
      - name: Run authenticated and guest UI mock tests without external providers
        env:
          SHOPQUERY_E2E_START_SERVER: "1"
          SHOPQUERY_E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Preserve offline browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-browser-diagnostics
          path: frontend/test-results/
          retention-days: 2
          if-no-files-found: ignore
