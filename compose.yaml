name: shopquery-ai

services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.1-pg17-trixie
    environment:
      POSTGRES_DB: shopquery
      POSTGRES_USER: shopquery_setup
      POSTGRES_PASSWORD: setup_password
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopquery_setup -d shopquery"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-inetcloud-knowledge}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_INVITED_EMAILS: '${AUTH_INVITED_EMAILS:-[]}'
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      BETA_PROVIDER_DATA_ENABLED: ${BETA_PROVIDER_DATA_ENABLED:-false}
      BETA_LOGIN_PER_IP_HOUR: ${BETA_LOGIN_PER_IP_HOUR:-20}
      TRUSTED_PROXY_HOSTS: '["web"]'
      BETA_CHAT_PER_USER_HOUR: ${BETA_CHAT_PER_USER_HOUR:-30}
      BETA_UPLOAD_PER_USER_HOUR: ${BETA_UPLOAD_PER_USER_HOUR:-60}
      BETA_PREVIEW_PER_USER_HOUR: ${BETA_PREVIEW_PER_USER_HOUR:-180}
      BETA_USER_CONCURRENCY: ${BETA_USER_CONCURRENCY:-1}
      BETA_SYSTEM_CONCURRENCY: ${BETA_SYSTEM_CONCURRENCY:-4}
      BETA_MAX_DATASETS: ${BETA_MAX_DATASETS:-20}
      BETA_MAX_USER_BYTES: ${BETA_MAX_USER_BYTES:-104857600}
      GUEST_ENABLED: ${GUEST_ENABLED:-true}
      GUEST_AI_ENABLED: ${GUEST_AI_ENABLED:-false}
      GUEST_SESSION_SECONDS: ${GUEST_SESSION_SECONDS:-600}
      GUEST_CLEANUP_SECONDS: ${GUEST_CLEANUP_SECONDS:-15}
      GUEST_MAX_SESSIONS: ${GUEST_MAX_SESSIONS:-20}
      GUEST_QUESTIONS_PER_SESSION: ${GUEST_QUESTIONS_PER_SESSION:-5}
      GUEST_CHAT_PER_IP_HOUR: ${GUEST_CHAT_PER_IP_HOUR:-10}
      GUEST_SESSIONS_PER_IP_HOUR: ${GUEST_SESSIONS_PER_IP_HOUR:-120}
      GUEST_UPLOADS_PER_IP_HOUR: ${GUEST_UPLOADS_PER_IP_HOUR:-60}
      GUEST_PREVIEWS_PER_IP_HOUR: ${GUEST_PREVIEWS_PER_IP_HOUR:-180}
      GUEST_PREVIEWS_PER_SESSION: ${GUEST_PREVIEWS_PER_SESSION:-40}
      GUEST_SYSTEM_CONCURRENCY: ${GUEST_SYSTEM_CONCURRENCY:-2}
      GUEST_MAX_FILES: ${GUEST_MAX_FILES:-8}
      GUEST_MAX_FILE_BYTES: ${GUEST_MAX_FILE_BYTES:-5242880}
      GUEST_MAX_SESSION_BYTES: ${GUEST_MAX_SESSION_BYTES:-33554432}
      GUEST_MAX_TOTAL_BYTES: ${GUEST_MAX_TOTAL_BYTES:-134217728}
      GUEST_MAX_ROWS: ${GUEST_MAX_ROWS:-5000}
      GUEST_MAX_COLUMNS: ${GUEST_MAX_COLUMNS:-30}
      GUEST_MAX_PAGES: ${GUEST_MAX_PAGES:-20}
      GUEST_MAX_CHARACTERS: ${GUEST_MAX_CHARACTERS:-100000}
      GUEST_MAX_CHUNKS: ${GUEST_MAX_CHUNKS:-32}
      GUEST_MAX_PROMPT_CHARACTERS: ${GUEST_MAX_PROMPT_CHARACTERS:-2000}
      GUEST_PARSE_TIMEOUT_SECONDS: ${GUEST_PARSE_TIMEOUT_SECONDS:-10}
      GUEST_REQUEST_TIMEOUT_SECONDS: ${GUEST_REQUEST_TIMEOUT_SECONDS:-120}
      GUEST_WORKER_MEMORY_MB: ${GUEST_WORKER_MEMORY_MB:-768}
      GUEST_WORKER_CPU_SECONDS: ${GUEST_WORKER_CPU_SECONDS:-15}
      INETCLOUD_BASE_URL: ${INETCLOUD_BASE_URL:-}
      INETCLOUD_MODEL: ${INETCLOUD_MODEL:-knowledge}
      INETCLOUD_TIMEOUT_SECONDS: ${INETCLOUD_TIMEOUT_SECONDS:-60}
      INETCLOUD_RETRY_ATTEMPTS: ${INETCLOUD_RETRY_ATTEMPTS:-1}
      AI_GEMINI_FALLBACK_ENABLED: ${AI_GEMINI_FALLBACK_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      GEMINI_REQUEST_TIMEOUT_MS: ${GEMINI_REQUEST_TIMEOUT_MS:-30000}
      GEMINI_RETRY_ATTEMPTS: ${GEMINI_RETRY_ATTEMPTS:-3}
      EMBEDDING_DIMENSIONS: 768
      DATABASE_SETUP_URL: postgresql+psycopg://shopquery_setup:setup_password@db:5432/shopquery
      DATABASE_READONLY_URL: postgresql+psycopg://shopquery_reader:readonly_password@db:5432/shopquery
      DEMO_REFERENCE_DATE: ${DEMO_REFERENCE_DATE:-2026-10-01}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-shopquery-ai_postgres_data}

networks:
  backend:
